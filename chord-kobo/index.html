.rp.l{left:0}.rp.r{right:0;transform:scaleX(-1)}

<script>
const $=s=>document.querySelector(s);
const FONTS={g:['ゴシック','"Hiragino Sans","Yu Gothic",Meiryo,sans-serif'],m:['明朝','"Hiragino Mincho ProN","Yu Mincho",serif'],r:['丸ゴ','"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif'],k:['手書き風','"Klee One","Yu Kyokasho","Comic Sans MS",cursive'],c:['等幅','"Courier New",monospace']};
const SIZES={S:['小',2.2],M:['中',3.2],L:['大',4.6],X:['特大',7]};
const COLORS=['#111111','#d62828','#1d4ed8','#15803d','#c2410c','#7e22ce','#888888'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mkRow=n=>({t:'c',bars:Array.from({length:n},()=>[''])});
const mkTxt=()=>({t:'x',text:'',size:'M',color:'#111111',font:'g',align:'left',bold:false});
let S,sel={r:0,b:0,s:0},hist=[],hi=0;
try{S=JSON.parse(localStorage.getItem('chord1'))}catch(e){}
if(!S||!S.rows)S={title:'',artist:'',sub:'',max:4,rows:Array.from({length:10},()=>mkRow(4))};
while(S.rows.length<10)S.rows.push(mkRow(S.max||4));hist=[JSON.stringify(S)];
function persist(){try{localStorage.setItem('chord1',JSON.stringify(S))}catch(e){}}
function commit(){const j=JSON.stringify(S);if(j===hist[hi])return;hist=hist.slice(0,hi+1);hist.push(j);if(hist.length>150)hist.shift();hi=hist.length-1;persist();btns()}
function load(j){S=JSON.parse(j);clamp();persist();all()}
function undo(){commit();if(hi>0){hi--;load(hist[hi])}}
function redo(){if(hi<hist.length-1){hi++;load(hist[hi])}}
function btns(){$('#undo').disabled=hi<=0;$('#redo').disabled=hi>=hist.length-1}
function clamp(){sel.r=Math.max(0,Math.min(sel.r,S.rows.length-1));const R=S.rows[sel.r];if(R.t==='c'){sel.b=Math.max(0,Math.min(sel.b||0,R.bars.length-1));sel.s=Math.max(0,Math.min(sel.s||0,R.bars[sel.b].length-1))}}
function fmt(c){if(!c)return'';const m=c.match(/^([A-Ga-g])([b#♭♯]?)(.*)$/);if(!m)return esc(c);
 const a=m[2].replace('b','♭').replace('#','♯');const q=m[3].replace(/\/([A-Ga-g])([b#♭♯]?)/g,(x,l,k)=>'/'+l.toUpperCase()+k.replace('b','♭').replace('#','♯')).replace(/#/g,'♯').replace(/b(?=\d)/g,'♭');
 return esc(m[1].toUpperCase()+a)+(q?'<span class="q">'+esc(q)+'</span>':'')}
const SHP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],FLT=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'],BASE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function trNote(l,a,n,fl){let v=BASE[l];if(/[#♯]/.test(a))v++;else if(/[b♭]/.test(a))v--;v=((v+n)%12+12)%12;return (fl?FLT:SHP)[v]}
function trChord(c,n,fl){if(!c)return c;const m=c.match(/^([A-G])([b#♭♯]?)(.*)$/);if(!m)return c;
 return trNote(m[1],m[2],n,fl)+m[3].replace(/\/([A-G])([b#♭♯]?)/g,(x,l,a)=>'/'+trNote(l,a,n,fl))}
function closeMd(){$('#md').classList.remove('on')}
function doTranspose(){const n=Math.max(-11,Math.min(11,Math.round(+$('#tn').value)||0));if(!n){closeMd();return}const fl=$('#tf').value==='f';
 S.rows.forEach(R=>{if(R.t==='c')R.bars=R.bars.map(B=>B.map(c=>trChord(c,n,fl)))});
 S.sub=(S.sub||'').replace(/(Key\s*[:=：]?\s*)([A-Ga-g])([b#♭♯]?)/i,(x,p,l,a)=>p+trNote(l.toUpperCase(),a,n,fl));
 $('#tn').value=0;commit();all();closeMd()}
const DL={async save({filename,data}){const type=/\.pdf$/i.test(filename)?'application/pdf':'application/json';const blob=data instanceof Blob?data:new Blob([data],{type});
 if(matchMedia('(pointer:coarse)').matches&&navigator.canShare){try{const f=new File([blob],filename,{type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==='AbortError')return}}
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}};
async function saveFile(){const dl=DL;
 if(!dl){alert('この画面ではファイル保存を使えません。');return}
 commit();const name=((S.title||'chord-chart')+(S.artist?' - '+S.artist:'')).replace(/[\\/:*?"<>|]/g,'_');
 try{await dl.save({filename:name+'.json',data:JSON.stringify({app:'chord-chart',version:1,data:S})})}catch(e){if(!e||e.code!=='declined')alert('保存できませんでした。')}}
function loadFile(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result),d=o&&o.data?o.data:o;
  if(!d||!Array.isArray(d.rows)||!d.rows.every(R=>R&&(R.t==='x'||(R.t==='c'&&Array.isArray(R.bars)&&R.bars.length&&R.bars.every(B=>Array.isArray(B)&&B.length)))))throw 0;
  if(!confirm('現在の譜面を読み込んだ内容で置き換えます。よろしいですか？（「戻す」で元に戻せます）'))return;
  S=d;S.title=S.title||'';S.artist=S.artist||'';S.sub=S.sub||'';S.max=Math.max(1,Math.min(9,(S.max|0)||4));
  while(S.rows.length<10)S.rows.push(mkRow(S.max));S.rows.length=Math.min(S.rows.length,25);
  sel={r:0,b:0,s:0};clamp();commit();all();closeMd()}catch(x){alert('このファイルは読み込めませんでした。')}};r.readAsText(f)}
function cloneStyled(src){
 const isIn=src.tagName==='INPUT',dst=document.createElement(isIn?'div':src.tagName.toLowerCase());
 const sty=(cs,t)=>{let c='';for(const p of cs)c+=p+':'+cs.getPropertyValue(p)+';';t.setAttribute('style',c)};
 sty(getComputedStyle(src),dst);
 const pb=getComputedStyle(src,'::before');
 if(!isIn&&pb.content&&pb.content!=='none'&&pb.content!=='normal'){const s=document.createElement('span');sty(pb,s);s.textContent=pb.content.replace(/^"|"$/g,'');dst.appendChild(s)}
 if(isIn){dst.textContent=src.value;dst.style.display='block'}
 else src.childNodes.forEach(c=>{if(c.nodeType===3)dst.appendChild(c.cloneNode());else if(c.nodeType===1)dst.appendChild(cloneStyled(c))});
 return dst}
async function exportPDF(){
 const btn=$('#pdf');const dl=DL;
 if(!dl){alert('この画面ではPDF保存を使えません。🖨の印刷から「PDFに保存」を選んでください。');return}
 if(!window.jspdf||!window.html2canvas){alert('PDFライブラリを読み込めませんでした。通信状況を確認してください。');return}
 commit();btn.disabled=true;btn.textContent='作成中…';
 const sh=document.querySelector('.sheet'),box=document.createElement('div');let host=null;
 box.style.cssText='position:fixed;left:-99999px;top:0;width:794px';
 try{
  const off=sh.cloneNode(true);off.classList.add('exp');off.style.margin='0';off.style.boxShadow='none';
  const a=sh.querySelectorAll('input'),b=off.querySelectorAll('input');a.forEach((x,i)=>{b[i].value=x.value});
  box.appendChild(off);document.body.appendChild(box);
  const root=cloneStyled(off);root.style.margin='0';root.style.boxShadow='none';root.style.maxWidth='none';
  box.remove();
  host=document.createElement('div');host.style.cssText='position:fixed;left:-99999px;top:0';host.appendChild(root);document.body.appendChild(host);
  const cv=await html2canvas(root,{scale:2,backgroundColor:'#fff',logging:false});
  const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',compress:true});
  pdf.addImage(cv.toDataURL('image/png'),'PNG',8,8,194,280);
  const name=((S.title||'chord-chart')+(S.artist?' - '+S.artist:'')).replace(/[\\/:*?"<>|]/g,'_');
  await dl.save({filename:name+'.pdf',data:pdf.output('blob')});
 }catch(e){if(!e||e.code!=='declined')alert('PDFを作成できませんでした。🖨の印刷から「PDFに保存」もお試しください。'+(e&&e.message?'\n'+e.message:''))}
 finally{box.remove();if(host)host.remove();btn.disabled=false;btn.textContent='PDF'}}
function layout(){const sh=document.querySelector('.sheet'),W=sh.clientWidth;if(!W)return;
 const top=$('#rows').getBoundingClientRect().top-sh.getBoundingClientRect().top;
 const avail=(sh.clientHeight-top)/W*100-2;
 const n=Math.max(10,S.rows.length),g0=1.2;
 const need=(R,lf)=>{if(R.t!=='c')return g0;const anyV=R.m&&R.m.some(upM),stack=!!(R.m&&upM(R.m[0]));
  return Math.max(g0,R.label?(stack?lf*3+.6:Math.max(lf*1.45+1.1,anyV?lf*1.3+.6:0)):(anyV?lf*1.3+.6:0))};
 const sum=lf=>S.rows.reduce((a,R)=>a+need(R,lf)+(btm(R)?lf*1.3+.4:0),0)+(n-S.rows.length)*g0;
 let lf=1.7,rh=(avail-sum(lf))/n;
 while(rh<4&&lf>.9){lf=Math.round((lf-.1)*10)/10;rh=(avail-sum(lf))/n}
 rh=Math.max(1,Math.min(rh,9.5));const extra=Math.max(0,avail-(n*rh+sum(lf))),slot=rh+g0+extra/n,gp=g0;window.GP=S.rows.map(R=>need(R,lf)+extra/n);window.BT=S.rows.map(R=>btm(R)?lf*1.3+.4:0);
 const base=S.max>=7?2.9:S.max>=5?3.5:4.2,f=Math.min(base,rh*.62);
 const st=$('#rows').style;[['slot',slot],['rh',rh],['gp',gp],['lf',lf],['f',f]].forEach(([k,v])=>st.setProperty('--'+k,v.toFixed(3)+'cqw'))}
function blank(R){return R.t==='x'?!R.text:!R.label&&!R.rep&&R.bars.every(B=>B.every(c=>!c))&&!(R.m&&R.m.some(m=>m&&Object.values(m).some(v=>v)))}
function setRows(n){n=Math.max(10,Math.min(25,Math.round(n)||S.rows.length));
 if(n<S.rows.length&&!S.rows.slice(n).every(blank)&&!confirm('末尾の'+(S.rows.length-n)+'段(入力済みを含む)を削除しますか？'))return all();
 while(S.rows.length<n)S.rows.push(mkRow(S.max));S.rows.length=n;clamp();commit();all()}
function renderSheet(){layout();
 $('#title').value=S.title;$('#artist').value=S.artist||'';$('#sub').value=S.sub;$('#mx').value=S.max;$('#nr').value=S.rows.length;document.querySelectorAll('[data-mx]').forEach(b=>b.style.outline=+b.dataset.mx===S.max?'2px solid var(--ac)':'');
 const f=S.max>=7?2.3:S.max>=5?2.8:3.4;
 $('#rows').innerHTML=S.rows.map((R,r)=>{
