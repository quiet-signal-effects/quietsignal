<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>オペアンプ増幅率計算ツール</title><style>body{font-family:system-ui,'Noto Sans JP',sans-serif;background:#f5f6f7;color:#20252b;margin:0;padding:8px}main{max-width:650px;margin:auto;background:white;border:1px solid #ddd;border-radius:15px;padding:12px;box-shadow:0 5px 22px #0001}h1{font-size:1.35rem;margin:0 0 8px}.tabs{display:flex;gap:8px}.tabs button{flex:1;border:1px solid #cbd0d5;background:#f5f6f8;border-radius:9px;padding:8px;font-size:.95rem;cursor:pointer}.tabs button.active{background:#244a64;color:white;border-color:#244a64}.schematic{border:1px solid #e0e3e6;border-radius:10px;margin:7px 0;padding:4px;background:white}.schematic svg{display:block;width:100%;max-width:390px;margin:auto;height:auto}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.fields label{font-weight:600;font-size:.95rem}.fields label{min-width:0;display:block}.resinput{display:flex;gap:6px;align-items:center;min-width:0;width:100%}.resinput input{min-width:0;width:0;flex:1 1 auto}.resinput select{flex:0 0 74px;min-width:0}.fields input,.fields select{box-sizing:border-box;margin-top:3px;padding:6px;font-size:1rem;border:1px solid #b9c0c7;border-radius:8px}.results{background:#f0f4f7;border-radius:10px;padding:9px;margin-top:7px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.results strong{font-size:1.35rem;display:block;margin-top:2px}.gain-equation{font-size:.8rem;margin:2px 0 7px;text-align:left;color:#59636d;line-height:1.6}.gain-equation .eq{font-family:inherit;font-size:inherit;color:inherit}.note{font-size:.8rem;margin:7px 0;color:#59636d;line-height:1.6}.err{color:#bd2736;min-height:0;margin:4px 0}.wire{fill:none;stroke:#24282d;stroke-width:2.3;stroke-linejoin:round;stroke-linecap:square}.component{fill:#fff;stroke:#24282d;stroke-width:2.3}.node{fill:#24282d}.mark{font:20px Georgia,serif;fill:#24282d}.lab{font:italic 22px Georgia,serif;fill:#24282d}.value{font:15px system-ui,sans-serif;fill:#34566b}.ground{stroke:#24282d;stroke-width:2.3;fill:none}[hidden]{display:none!important}@media(max-width:560px){.fields{grid-template-columns:minmax(0,1fr)}body{padding:10px}main{padding:10px}.results strong{font-size:1.35rem}.lab{font-size:22px}}</style></head><body><main><h1>オペアンプ増幅率計算ツール</h1><div class="tabs"><button id="nonbtn" class="active" type="button">非反転増幅</button><button id="invbtn" type="button">反転増幅</button></div><div class="schematic"><svg id="non" viewBox="0 0 600 360" role="img" aria-label="非反転増幅回路。Vinはプラス入力、マイナス入力はRgとRfの接続点へ、RgはGND、RfはVoutへ接続。"><!-- reference-based layout: input + upper, feedback lower -->
<path class="component" d="M230 62 L230 158 L326 110 Z"/><path class="wire" d="M120 84 H230 M326 110 H490 M350 110 V222 H285"/><path class="wire" d="M230 135 H202 V222 H233"/><path class="wire" d="M233 222 H245 M285 222 H350"/><path class="wire" d="M202 222 V245"/><rect class="component" x="192" y="245" width="20" height="57"/><path class="wire" d="M202 302 V324"/><path class="ground" d="M184 324 H220 M190 331 H214 M196 338 H208"/><path class="component" d="M245 212 L285 212 L285 232 L245 232 Z"/><circle class="node" cx="202" cy="222" r="4"/><circle class="node" cx="350" cy="110" r="4"/><text class="mark" x="238" y="91">+</text><text class="mark" x="238" y="143">−</text><text class="lab" x="60" y="78">v<tspan baseline-shift="sub" font-size="15">in</tspan></text><text class="lab" x="504" y="117">v<tspan baseline-shift="sub" font-size="15">out</tspan></text><text class="lab" x="156" y="278">Rg</text><text class="lab" x="254" y="199">Rf</text><text class="value" id="nonrg" x="150" y="298"></text><text class="value" id="nonrf" x="254" y="252"></text></svg>
<svg id="inv" viewBox="0 0 600 360" role="img" aria-label="反転増幅回路。VinはRinを通してマイナス入力、プラス入力はGND、Rfは出力からマイナス入力へ帰還。" style="display:none"><path class="component" d="M245 104 L245 220 L347 162 Z"/><path class="wire" d="M70 126 H125 M175 126 H245 M347 162 H490"/><rect class="component" x="125" y="116" width="50" height="20"/><path class="wire" d="M205 126 V54 H278 M328 54 H392 V162"/><rect class="component" x="278" y="44" width="50" height="20"/><path class="wire" d="M245 198 H215 V252"/><path class="ground" d="M197 252 H233 M203 259 H227 M209 266 H221"/><circle class="node" cx="205" cy="126" r="4"/><circle class="node" cx="392" cy="162" r="4"/><text class="mark" x="253" y="141">−</text><text class="mark" x="253" y="204">+</text><text class="lab" x="32" y="116">v<tspan baseline-shift="sub" font-size="15">in</tspan></text><text class="lab" x="502" y="169">v<tspan baseline-shift="sub" font-size="15">out</tspan></text><text class="lab" x="134" y="105">Rin</text><text class="lab" x="289" y="35">Rf</text><text class="value" id="invrin" x="132" y="159"></text><text class="value" id="invrf" x="282" y="88"></text></svg></div><div class="fields">
<label id="rgField">Rg（GND側）<span class="resinput"><input id="rg" type="number" min="0.000001" step="any" value="10" inputmode="decimal"><select id="rgUnit" aria-label="Rgの単位"><option value="1">Ω</option><option value="1000" selected>kΩ</option><option value="1000000">MΩ</option></select></span></label>
<label id="rinField" hidden>Rin（入力抵抗）<span class="resinput"><input id="rin" type="number" min="0.000001" step="any" value="10" inputmode="decimal"><select id="rinUnit" aria-label="Rinの単位"><option value="1">Ω</option><option value="1000" selected>kΩ</option><option value="1000000">MΩ</option></select></span></label>
<label>Rf（帰還抵抗）<span class="resinput"><input id="rf" type="number" min="0" step="any" value="100" inputmode="decimal"><select id="rfUnit" aria-label="Rfの単位"><option value="1">Ω</option><option value="1000" selected>kΩ</option><option value="1000000">MΩ</option></select></span></label>
</div><div class="results"><div>電圧増幅率<strong id="gain">11 倍</strong></div><div>ゲイン<strong id="db">20.83 dB</strong></div></div><p id="formula" class="note">非反転増幅：Av = 1 + Rf / Rg</p><p class="gain-equation">ゲイン（dB）： <span class="eq">G<sub>dB</sub> = 20 log<sub>10</sub> |A<sub>v</sub>|</span></p><p id="err" class="err" aria-live="polite"></p><p class="note">理想オペアンプの閉ループ増幅率です。実際の周波数特性、電源電圧、出力振幅の制限は含みません。反転増幅の負号は位相反転を示します。</p></main><script>
const $=id=>document.getElementById(id);
let mode='non';
const fmt=n=>Number(n).toLocaleString('ja-JP',{maximumFractionDigits:4});
function displayRes(id){const el=$(id+'Unit');return fmt(Number($(id).value))+el.options[el.selectedIndex].text;}
function ohms(id){return Number($(id).value)*Number($(id+'Unit').value);}
function update(){
  const first=mode==='non'?'rg':'rin';
  const r=ohms(first),rf=ohms('rf');
  const valid=$(first).value.trim()!==''&&$('rf').value.trim()!==''&&Number.isFinite(r)&&Number.isFinite(rf)&&r>0&&rf>=0;
  const gain=mode==='non'?1+rf/r:-rf/r;
  $('err').textContent=valid?'':'抵抗値を確認してください。Rg / Rin は0より大きく、Rfは0以上にしてください。';
  $('gain').textContent=valid?fmt(gain)+' 倍':'—';
  $('db').textContent=valid?(gain===0?'−∞ dB':fmt(20*Math.log10(Math.abs(gain)))+' dB'):'—';
  $('nonrg').textContent=$('rg').value.trim()!==''?displayRes('rg'):'';
  $('nonrf').textContent=$('rf').value.trim()!==''?displayRes('rf'):'';
  $('invrin').textContent=$('rin').value.trim()!==''?displayRes('rin'):'';
  $('invrf').textContent=$('rf').value.trim()!==''?displayRes('rf'):'';
}
function setMode(m){
 mode=m;
 $('non').style.display=m==='non'?'block':'none';
 $('inv').style.display=m==='inv'?'block':'none';
 $('nonbtn').classList.toggle('active',m==='non');
 $('invbtn').classList.toggle('active',m==='inv');
 $('rgField').hidden=m!=='non';$('rinField').hidden=m!=='inv';
 $('formula').textContent=m==='non'?'非反転増幅：Av = 1 + Rf / Rg':'反転増幅：Av = −Rf / Rin';
 update();
}
$('nonbtn').onclick=()=>setMode('non');$('invbtn').onclick=()=>setMode('inv');
['rg','rin','rf','rgUnit','rinUnit','rfUnit'].forEach(id=>$(id).addEventListener('input',update));
setMode('non');
</script></body></html>
